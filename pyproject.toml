[project]
name = "karma-track"
version = "0.1.0"
description = "Track r/anime episode discussions and generate weekly karma rankings."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.11,<4",
    "beautifulsoup4>=4.12,<5",
    "flask>=3.1,<4",
    "frozen-flask>=1,<2",
    "loguru>=0.7,<1",
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "praw>=7.8.1,<8",
    "pydantic>=2.10,<3",
    "pymongo>=4.11,<5",
    "python-dotenv>=1,<2",
    "pytz>=2024.2",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "ipython>=8.31,<10",
]

[tool.uv]
package = false
